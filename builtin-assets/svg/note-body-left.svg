<svg xmlns="http://www.w3.org/2000/svg" width="var(--pw)" height="var(--ph)" viewBox="var(--view)" preserveAspectRatio="none">
    <linearGradient id="v" gradientUnits="userSpaceOnUse" x1="0" y1="var(--vya)" x2="0" y2="var(--vyb)">var(--vstops)</linearGradient>
    <linearGradient id="h" gradientUnits="userSpaceOnUse" x1="var(--hxa)" y1="0" x2="var(--hxb)" y2="0">var(--hstops)</linearGradient>
    <mask id="m" maskUnits="userSpaceOnUse" x="-100" y="-200" width="300" height="800">
        <rect x="-100" y="-200" width="300" height="800" fill="url(#h)"/>
    </mask>
    <rect x="-100" y="var(--vya)" width="300" height="var(--vyh)" fill="var(--halo)" mask="url(#m)"/>
    <path d="var(--rim)" fill="var(--outer)"/>
    <path d="var(--face)" fill="var(--inner)"/>
    <path d="var(--mark)" fill="var(--accent)"/>
</svg>
