name: Check

on:
    push:
        branches: ['main', 'ci/**']
    pull_request:
        branches: ['main']
    workflow_call:
        inputs:
            skip_browser_checks:
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    # A newer push to a branch or pull request cancels the run it replaces; main and tags run to the end.
    # Deploy Pages calls this workflow on a tag. Its own groups are named pages-*, so they never clash.
    group: check-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
            - run: npm ci
            - run: npm run check-type
            - run: npm run check-lint
            - run: npm run check-format
            - run: npm test
            # One call, so the golden pair's completeFrom claim is checked against write-1.
            - name: Check the .nxsp fixtures with the independent checker
              run: uv run python -I tools/nxsp_check.py tests/local/nxsp/golden-v1/*.nxsp tests/zip/plan-conformance-v1/*/expected.nxsp
            - run: npm run test:release
            - run: npm run check:builtin-assets
            - run: npm run build:native
            - run: npm run check:native-bundle

    compatibility:
        if: ${{ !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        # About 11 min of tests, 7 of them in firefox-chrome, with one worker (a 4-vCPU runner's).
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: scripts/ci/install-browsers.sh firefox webkit
            # The default preview skin and particle, hash-locked, as build:release stages them.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=firefox --project=firefox-chrome --project=firefox-production --project=firefox-preview-worker --project=webkit --project=webkit-production --project=mobile-webkit-production
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: compatibility-failures
                  path: test-results-compatibility/
                  if-no-files-found: ignore
                  retention-days: 7

    compatibility-storage:
        if: ${{ !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        # The storage core: about 9 min of tests in Firefox and 4 in WebKit on a fast desktop.
        # browsers-full.yml runs the rest of the storage specs.
        timeout-minutes: 25
        env:
            NSE_STORAGE_SET: core
        strategy:
            fail-fast: false
            matrix:
                include:
                    - engine: firefox
                      shard: 1/2
                    - engine: firefox
                      shard: 2/2
                    - engine: webkit
                      shard: 1/1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: scripts/ci/install-browsers.sh ${{ matrix.engine }}
            # The default preview skin and particle, hash-locked, as build:release stages them.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=${{ matrix.engine }}-storage --project=${{ matrix.engine }}-production-storage --shard=${{ matrix.shard }}
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: compatibility-storage-failures-${{ strategy.job-index }}
                  path: test-results-compatibility/
                  if-no-files-found: ignore
                  retention-days: 7
