name: Check

on:
    push:
        branches: ['main', 'ci/**']
    pull_request:
        branches: ['main']
    workflow_call:
        inputs:
            skip_browser_checks:
                type: boolean
                default: false

permissions:
    contents: read

concurrency:
    # A newer push to a branch or pull request cancels the run it replaces; main and tags run to the end.
    # Deploy Pages calls this workflow on a tag. Its own groups are named pages-*, so they never clash.
    group: check-${{ github.ref }}
    cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
            - run: npm ci
            - run: npm run check-type
            - run: npm run check-lint
            - run: npm run check-format
            # One call, so the completeFrom claims between files are checked: the golden pair's against
            # write-1, and the v1 fixtures' against each other.
            - name: Check the .nxsp fixtures with the independent checker
              run: uv run python -I tools/nxsp_check.py tests/local/nxsp/golden-v1/*.nxsp tests/zip/plan-conformance-v1/*/expected.nxsp tests/native/fixtures/nxsp-v1/*.nxsp tests/fixtures/web-storage-v1/*.nxsp
            - run: npm run test:release
            - run: npm run check:builtin-assets
            - run: npm run build:native
            - run: npm run check:native-bundle

    # The unit suites are a job of their own, beside the checks above: they take about 9 min. Some of them
    # run the independent .nxsp checker, so this job needs uv.
    unit:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
            - run: npm ci
            - run: npm test

    compatibility:
        if: ${{ !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        # About 8 min of tests with two workers on a 4-vCPU runner.
        timeout-minutes: 30
        # Playwright's image holds Firefox, WebKit and their system packages. Its version is the one in
        # package-lock.json (tests/release/workflows.test.mjs checks that). Firefox needs a writable HOME.
        container: mcr.microsoft.com/playwright:v1.63.0-noble
        env:
            HOME: /root
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            # The five locked preview packages, as build:release stages them. Without them the build is Built-in only.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=firefox --project=firefox-chrome --project=firefox-production --project=firefox-preview-worker --project=webkit --project=webkit-production --project=mobile-webkit-production --workers=2
            # The tests that passed only on a retry, and each failure: a summary of this job, and a list for the flaky job.
            - name: List flaky tests
              if: ${{ !cancelled() }}
              run: node scripts/flaky-report.mjs shard "compatibility"
            - name: Upload the flaky test list
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: flaky-compatibility
                  path: flaky-list/*.json
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: compatibility-failures
                  path: test-results-compatibility/
                  if-no-files-found: ignore
                  retention-days: 7

    # The v1 fixtures read by the running editor in Chromium, on every push (Browsers Full is the only other
    # Chromium run): the write-back of each history file, the saving
    # marker, and the web storage reads (docs/format-versioning.md section 8).
    formats:
        if: ${{ !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        # About 2 min of tests with two workers on a fast desktop.
        timeout-minutes: 25
        container:
            image: mcr.microsoft.com/playwright:v1.63.0-noble
            options: --ipc=host
        env:
            HOME: /root
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: npx playwright test tests/browser/formats --project=chromium --workers=2
            # The tests that passed only on a retry, and each failure: a summary of this job, and a list for the flaky job.
            - name: List flaky tests
              if: ${{ !cancelled() }}
              run: node scripts/flaky-report.mjs shard "formats"
            - name: Upload the flaky test list
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: flaky-formats
                  path: flaky-list/*.json
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: formats-failures
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 7

    compatibility-storage:
        if: ${{ !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        # The storage core: about 9 min of tests in Firefox and 4 in WebKit on a fast desktop.
        # browsers-full.yml runs the rest of the storage specs.
        timeout-minutes: 25
        container: mcr.microsoft.com/playwright:v1.63.0-noble
        env:
            HOME: /root
            NSE_STORAGE_SET: core
        strategy:
            fail-fast: false
            matrix:
                include:
                    - engine: firefox
                      shard: 1/2
                    - engine: firefox
                      shard: 2/2
                    - engine: webkit
                      shard: 1/1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            # The five locked preview packages, as build:release stages them. Without them the build is Built-in only.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=${{ matrix.engine }}-storage --project=${{ matrix.engine }}-production-storage --shard=${{ matrix.shard }}
            # The tests that passed only on a retry, and each failure: a summary of this job, and a list for the flaky job.
            - name: List flaky tests
              if: ${{ !cancelled() }}
              run: node scripts/flaky-report.mjs shard "${{ matrix.engine }} storage ${{ matrix.shard }}"
            - name: Upload the flaky test list
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: flaky-compatibility-storage-${{ strategy.job-index }}
                  path: flaky-list/*.json
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: compatibility-storage-failures-${{ strategy.job-index }}
                  path: test-results-compatibility/
                  if-no-files-found: ignore
                  retention-days: 7

    # One table of every flaky test and failure in this run, from the lists of the jobs above. It never fails the run.
    flaky:
        needs: [compatibility, formats, compatibility-storage]
        if: ${{ !cancelled() && !inputs.skip_browser_checks }}
        runs-on: ubuntu-latest
        timeout-minutes: 5
        continue-on-error: true
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
              continue-on-error: true
              with:
                  pattern: flaky-*
                  path: flaky-lists
                  merge-multiple: true
            - run: node scripts/flaky-report.mjs collect flaky-lists
