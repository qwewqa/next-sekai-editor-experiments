name: Check

on:
    push:
        branches: ['main', 'ci/**']
    pull_request:
        branches: ['main']
    workflow_call:
        inputs:
            skip_browser_checks:
                type: boolean
                default: false

permissions:
    contents: read

jobs:
    diag:
        runs-on: ubuntu-latest
        timeout-minutes: 25
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: npx playwright install --with-deps webkit
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=webkit-storage storageFlush.spec.ts zzDiagIdb.spec.ts -g 'picked BGM|diag idb' --reporter=line --retries=0
