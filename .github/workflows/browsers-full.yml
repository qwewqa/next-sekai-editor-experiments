name: Browsers Full

# The whole storage set in Firefox and WebKit. Check runs the storage core on every push; this adds the
# slow specs, startup and opening a project file. A release needs a passed run on its commit:
# gh workflow run browsers-full.yml --ref main
on:
    workflow_dispatch:
    schedule:
        - cron: '17 3 * * *'
    push:
        branches: ['ci/**']

permissions:
    contents: read

concurrency:
    # Only a push to a ci/ branch is replaced by a newer push; a nightly or a dispatch always runs.
    group: browsers-full-${{ github.event_name == 'push' && github.ref || github.run_id }}
    cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
    storage:
        runs-on: ubuntu-latest
        # Every storage spec: about 22 min of tests in Firefox and 14 in WebKit on a fast desktop, the v1 web storage
        # fixtures spec (about 4.5 min on one worker) included.
        timeout-minutes: 25
        strategy:
            fail-fast: false
            matrix:
                include:
                    - engine: firefox
                      shard: 1/2
                    - engine: firefox
                      shard: 2/2
                    - engine: webkit
                      shard: 1/1
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: scripts/ci/install-browsers.sh ${{ matrix.engine }}
            # The five locked preview packages, as build:release stages them. Without them the build is Built-in only.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npm run build
            - run: xvfb-run -a npx playwright test --config playwright.compatibility.config.ts --project=${{ matrix.engine }}-storage --project=${{ matrix.engine }}-production-storage --shard=${{ matrix.shard }}
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: storage-failures-${{ strategy.job-index }}
                  path: test-results-compatibility/
                  if-no-files-found: ignore
                  retention-days: 7

    # The Chromium specs, as npm run test:browser runs them: the chromium and chromium-worker projects, about 4,500
    # tests, in shards. The timing specs are not run here: their budgets need a quiet machine with a GPU, so
    # they are a local check before a release (npm run test:timing).
    chromium:
        runs-on: ubuntu-latest
        # About 13 tests a minute with four workers on the 4-vCPU runner (5 times slower than a fast desktop), so one
        # of sixteen, about 280 tests, takes about 25 min, retries included.
        timeout-minutes: 60
        strategy:
            fail-fast: false
            matrix:
                shard: [1/16, 2/16, 3/16, 4/16, 5/16, 6/16, 7/16, 8/16, 9/16, 10/16, 11/16, 12/16, 13/16, 14/16, 15/16, 16/16]
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
            - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - run: scripts/ci/install-browsers.sh chromium
            # The five locked preview packages, as build:release stages them. Without them the preview specs fall back to Built-in only.
            - name: Fetch the preview assets
              run: node --input-type=module -e "const { stagePreviewAssets } = await import('./scripts/release-assets.mjs'); await stagePreviewAssets(process.cwd(), 'public')"
            - run: npx playwright test --project=chromium --project=chromium-worker --shard=${{ matrix.shard }} --workers=4
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: chromium-failures-${{ strategy.job-index }}
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 7
