name: Deploy Pages

on:
    push:
        branches: ['main']
        tags: ['v[0-9]+.[0-9]+.[0-9]+']
    pull_request:
        branches: ['main']

permissions:
    contents: read

concurrency:
    # all tags share one group, so deploys never overlap
    group: ${{ startsWith(github.ref, 'refs/tags/v') && 'pages-deploy' || format('pages-{0}', github.ref) }}
    cancel-in-progress: false

jobs:
    check:
        # Main and PRs already run Check; tags need their own gate before deployment.
        if: startsWith(github.ref, 'refs/tags/v')
        uses: ./.github/workflows/check.yml
        with:
            skip_browser_checks: ${{ github.event_name != 'pull_request' }}

    build:
        needs: check
        if: ${{ !cancelled() && (needs.check.result == 'success' || (needs.check.result == 'skipped' && !startsWith(github.ref, 'refs/tags/'))) }}
        runs-on: ubuntu-latest
        timeout-minutes: 25
        outputs:
            deploy: ${{ steps.highest.outputs.deploy }}
        steps:
            - name: Check out source
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - name: Set up Node
              uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
              with:
                  node-version-file: .node-version
                  cache: npm
            - run: npm ci
            - name: Install browser
              run: npx playwright install --with-deps chromium
            - run: npm run test:browser
              if: github.event_name == 'pull_request'
            - run: npm run build:release
              env:
                  PREVIEW_SKIN_URL: ${{ vars.PREVIEW_SKIN_URL }}
                  PREVIEW_PARTICLE_URL: ${{ vars.PREVIEW_PARTICLE_URL }}
            - run: npm run test:production
            - run: npm run check:release
            - name: Upload browser failure details
              if: failure()
              uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
              with:
                  name: browser-failures
                  path: |
                      test-results/
                      test-results-production/
                  if-no-files-found: ignore
                  retention-days: 7
            - name: Check that the tag is the highest
              # only the highest v* tag deploys
              id: highest
              if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'qwewqa/next-sekai-editor-experiments'
              shell: bash
              run: git ls-remote --tags --refs "https://github.com/$GITHUB_REPOSITORY.git" 'refs/tags/v*' | cut -f2 | node scripts/highest-tag.mjs "$GITHUB_REF_NAME"
            - name: Upload checked site
              if: steps.highest.outputs.deploy == 'true'
              uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
              with:
                  path: dist
                  retention-days: 30

    deploy:
        if: needs.build.outputs.deploy == 'true'
        needs: build
        runs-on: ubuntu-latest
        timeout-minutes: 15
        permissions:
            pages: write
            id-token: write
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - name: Configure Pages
              uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
            - name: Deploy checked site
              id: deployment
              uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
