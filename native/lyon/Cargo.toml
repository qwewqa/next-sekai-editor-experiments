[package]
name = "sekai-path-tessellator"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
lyon_tessellation = "=1.0.22"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
panic = "abort"

[profile.release-debug]
inherits = "release"
debug = 2
strip = "none"

