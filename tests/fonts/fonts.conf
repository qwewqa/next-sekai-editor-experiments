<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- Test-only. Makes every browser in the Linux CI container draw the app's sans-serif stack in Selawik,
     which has the metrics of Segoe UI, the font of the Windows development machines.
     scripts/ci/install-test-fonts.sh installs this file. -->
<fontconfig>
    <match target="pattern">
        <test name="family" qual="any"><string>system-ui</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>ui-sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>sans-serif</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>sans</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <!-- Chromium resolves its sans-serif default as Arial. -->
    <match target="pattern">
        <test name="family" qual="any"><string>Arial</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Helvetica</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
    <match target="pattern">
        <test name="family" qual="any"><string>Segoe UI</string></test>
        <edit name="family" mode="prepend" binding="strong"><string>Selawik</string></edit>
    </match>
</fontconfig>
