version = 1
SPDX-PackageName = "Next SEKAI Editor"
SPDX-PackageSupplier = "Next SEKAI Editor contributors"

# Which licence covers which path. Later annotations win over earlier ones.
# tests/licensing.test.mjs checks that every binary or media file has an annotation of its own.

[[annotations]]
path = "**"
SPDX-FileCopyrightText = "2025 NonSpicyBurrito and contributors"
SPDX-License-Identifier = "MIT"

# The Built-in set and the app icon family, wherever their files live: CC0, builtin-assets/LICENSE.txt.
[[annotations]]
path = [
    "builtin-assets/svg/**",
    "builtin-assets/out/**",
    "builtin-assets/builtin-assets.lock.json",
    "builtin-assets/LICENSE.txt",
    "public/builtin/**",
    "src-tauri/icons/**",
    "src-tauri/gen/apple/**/AppIcon.appiconset/**",
    "src-tauri/gen/android/**/res/mipmap-*/**",
]
SPDX-FileCopyrightText = "Next SEKAI Editor contributors"
SPDX-License-Identifier = "CC0-1.0"

# Test clips: a generated sine tone in each audio container, made for the clip-length tests.
[[annotations]]
path = "tests/preview/files/audio/**"
SPDX-FileCopyrightText = "Next SEKAI Editor contributors"
SPDX-License-Identifier = "CC0-1.0"

# The generators are code.
[[annotations]]
path = [
    "builtin-assets/*.mjs",
    "scripts/build-builtin-assets.mjs",
]
SPDX-FileCopyrightText = "Next SEKAI Editor contributors"
SPDX-License-Identifier = "MIT"

[[annotations]]
path = "src/landing/badges/**"
SPDX-FileCopyrightText = "Apple Inc. and Google LLC"
SPDX-License-Identifier = "LicenseRef-Store-Badges"

# Inherited from the upstream editor; the origin is unconfirmed, so MIT does not cover them.
[[annotations]]
path = [
    "src/preview/bg.png",
    "src/assets/se_live_*.mp3",
    "public/favicon.ico",
    "public/thumbnail.png",
]
SPDX-FileCopyrightText = "Unconfirmed"
SPDX-License-Identifier = "LicenseRef-Upstream-Unconfirmed"

